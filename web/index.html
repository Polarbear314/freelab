<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FreeLAB</title>
<style>
/* ============================================================= Obsidian-ish theme */
:root{
  --accent:#e0823d; --accent-soft:#e0823d33;
  --bg:#1e1e1e; --bg-2:#232323; --bg-3:#191919; --bg-hover:#2a2a2a;
  --panel:#1a1a1a; --border:#333; --border-soft:#2a2a2a;
  --text:#dcddde; --muted:#9aa0a6; --faint:#6b7075;
  --user:#2c3440; --assistant:#242424;
  --radius:8px; --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
}
:root.light{
  --bg:#ffffff; --bg-2:#f6f6f6; --bg-3:#f0f0f0; --bg-hover:#ececec;
  --panel:#fafafa; --border:#e2e2e2; --border-soft:#ececec;
  --text:#1f2328; --muted:#656d76; --faint:#8b939c;
  --user:#eef3fb; --assistant:#f6f6f6;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);
  font-size:14.5px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:var(--faint)}

/* ============================================================= layout */
#app{display:grid;grid-template-columns:48px var(--left,260px) 1fr var(--right,300px);
  grid-template-rows:minmax(0,1fr);height:100vh;overflow:hidden;
  transition:grid-template-columns .15s ease}
#app.no-right{--right:0px}
#app.no-left{--left:0px}

/* ribbon */
#ribbon{background:var(--bg-3);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px}
#ribbon .logo{font-size:20px;margin-bottom:10px}
.rib{width:34px;height:34px;border:0;background:transparent;border-radius:7px;
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted)}
.rib:hover{background:var(--bg-hover);color:var(--text)}
.rib.active{background:var(--accent-soft);color:var(--accent)}
#ribbon .spacer{flex:1}

/* left panel */
#left{background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;
  padding:12px 14px 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint);font-weight:600}
.panel-head .acts{display:flex;gap:2px}
.iconbtn{border:0;background:transparent;color:var(--muted);width:26px;height:26px;
  border-radius:6px;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--bg-hover);color:var(--text)}
#left .search{margin:0 10px 8px}
#left .search input{width:100%;background:var(--bg-2);border:1px solid var(--border);
  color:var(--text);border-radius:6px;padding:6px 9px;font-size:13px;outline:none}
#left .search input:focus{border-color:var(--accent)}
#list{overflow-y:auto;flex:1;padding:2px 8px 12px}
.item{padding:7px 9px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.item:hover{background:var(--bg-hover)}
.item.active{background:var(--accent-soft)}
.item .t{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-size:11px;color:var(--faint);display:flex;gap:8px}
.group-label{font-size:11px;color:var(--faint);padding:10px 10px 4px;font-weight:600}

/* main */
#main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
#tabbar{display:flex;align-items:center;gap:2px;padding:6px 10px;
  border-bottom:1px solid var(--border);background:var(--bg-2);min-height:42px}
.tab{padding:5px 12px;border-radius:6px 6px 0 0;font-size:13px;color:var(--muted);
  display:flex;align-items:center;gap:7px}
.tab:hover{background:var(--bg-hover);color:var(--text)}
.tab.active{background:var(--bg);color:var(--text)}
#tabbar .grow{flex:1}
.pill{font-size:11px;color:var(--faint);border:1px solid var(--border);
  border-radius:20px;padding:2px 9px}
#view{flex:1;min-height:0;overflow-y:auto;position:relative}

/* chat view */
.chat-col{height:100%;display:flex;flex-direction:column;min-height:0}
.chat-scroll{flex:1;overflow-y:auto;min-height:0}
.chat-wrap{max-width:820px;margin:0 auto;padding:24px 26px 30px}
.chat-title{font-size:22px;font-weight:600;margin:4px 0 18px}
.msg{margin:14px 0;display:flex;gap:12px}
.msg .av{width:26px;height:26px;border-radius:6px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:14px;background:var(--bg-3)}
.msg.user .av{background:var(--user)}
.bubble{background:var(--assistant);border:1px solid var(--border-soft);
  border-radius:10px;padding:11px 15px;min-width:0;flex:1;overflow-wrap:anywhere}
.msg.user .bubble{background:var(--user)}
.bubble p{margin:.4em 0}
.bubble pre{background:var(--bg-3);padding:10px 12px;border-radius:8px;overflow-x:auto;
  font-family:var(--mono);font-size:12.5px}
.bubble code{font-family:var(--mono);font-size:12.5px;background:var(--bg-3);
  padding:1px 5px;border-radius:4px}
.bubble pre code{background:transparent;padding:0}
.bubble a{color:var(--accent)}
.bubble em{color:var(--muted);font-style:italic}
.wl{color:var(--accent);cursor:pointer;text-decoration:none}
.wl:hover{text-decoration:underline}
.empty{color:var(--faint);text-align:center;margin-top:16vh;font-size:15px}
.ticker{font-size:13px;display:flex;flex-direction:column;gap:6px}
.ticker .tk{display:flex;align-items:center;gap:8px;transition:color .2s}
.ticker .tk.done{color:var(--faint)}
.ticker .tk.cur{color:var(--text)}

/* composer */
.composer{flex:none;padding:12px 26px 16px;border-top:1px solid var(--border);background:var(--bg)}
.composer .box{max-width:820px;margin:0 auto;background:var(--bg-2);
  border:1px solid var(--border);border-radius:12px;padding:8px 8px 8px 14px;
  display:flex;align-items:flex-end;gap:8px}
.composer textarea{flex:1;background:transparent;border:0;color:var(--text);
  resize:none;outline:none;font-size:14.5px;font-family:inherit;max-height:180px;padding:6px 0}
.composer .send{background:var(--accent);color:#fff;border:0;border-radius:8px;
  width:34px;height:34px;font-size:16px;flex:none}
.composer .send:disabled{opacity:.4}
.composer .tools{max-width:820px;margin:6px auto 0;display:flex;gap:14px;
  font-size:12px;color:var(--muted);align-items:center}
.toggle{display:flex;align-items:center;gap:6px;cursor:pointer}
.toggle input{accent-color:var(--accent)}
.attach-chip{background:var(--accent-soft);color:var(--accent);border-radius:20px;
  padding:2px 10px;font-size:12px;display:none;align-items:center;gap:6px}

/* right sidebar */
#right{background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;min-height:0;overflow:hidden}
#right .rtabs{display:flex;border-bottom:1px solid var(--border)}
#right .rtab{flex:1;padding:10px;text-align:center;font-size:12px;color:var(--muted);
  border-bottom:2px solid transparent}
#right .rtab.active{color:var(--text);border-bottom-color:var(--accent)}
#right .rbody{flex:1;overflow-y:auto;padding:12px 14px}
.src{border:1px solid var(--border-soft);border-radius:8px;margin-bottom:10px;overflow:hidden}
.src summary{padding:8px 11px;cursor:pointer;font-size:12.5px;background:var(--bg-2);
  display:flex;justify-content:space-between;gap:8px}
.src .body{padding:9px 11px;font-size:12.5px;color:var(--muted);white-space:pre-wrap}
.src b{color:var(--accent);font-weight:600}
.side-empty{color:var(--faint);font-size:13px;text-align:center;margin-top:30px}
.src-toggle{display:flex;gap:4px;margin:-12px -14px 10px;padding:12px 14px;
  position:sticky;top:-12px;background:var(--panel);z-index:3;border-bottom:1px solid var(--border-soft)}
.src-toggle button{flex:1;padding:6px;border:1px solid var(--border);background:var(--bg-2);
  color:var(--muted);border-radius:6px;font-size:12px}
.src-toggle button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.page-img{width:100%;border:1px solid var(--border);border-radius:6px;margin:4px 0;display:block}
.page-wrap{margin-bottom:14px}
.page-cap{font-size:11px;color:var(--faint);display:flex;justify-content:space-between;margin:2px 0}
.page-cap .cited{color:var(--accent);font-weight:600}
.page-wrap.cited .page-img{outline:2px solid var(--accent);outline-offset:1px}

/* tasks */
.tasks-wrap{max-width:760px;margin:0 auto;padding:22px 26px}
.task-grp h3{font-size:13px;color:var(--faint);text-transform:uppercase;
  letter-spacing:.04em;margin:22px 0 8px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:7px}
.task:hover{background:var(--bg-hover)}
.task input{margin-top:3px;accent-color:var(--accent)}
.task .tx{flex:1}
.task .src-note{font-size:11px;color:var(--faint)}
.task.done .tx{color:var(--faint);text-decoration:line-through}
.due{font-size:11px;border:1px solid var(--border);border-radius:14px;padding:1px 8px;color:var(--muted)}
.due.over{color:#e5534b;border-color:#e5534b55}
.due.today{color:var(--accent);border-color:var(--accent)}

/* calendar */
.cal-wrap{max-width:760px;margin:0 auto;padding:22px 26px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-head h2{font-size:18px;margin:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:11px;color:var(--faint);text-align:center;padding-bottom:4px}
.cal-day{aspect-ratio:1/.8;border:1px solid var(--border-soft);border-radius:8px;
  padding:6px 8px;font-size:12px;cursor:pointer;position:relative;background:var(--bg-2)}
.cal-day:hover{border-color:var(--accent)}
.cal-day.blank{background:transparent;border:0;cursor:default}
.cal-day.today{border-color:var(--accent)}
.cal-day.has::after{content:"";position:absolute;bottom:7px;right:7px;width:6px;height:6px;
  border-radius:50%;background:var(--accent)}
.editor{max-width:760px;margin:16px auto 0}
.editor textarea{width:100%;min-height:280px;background:var(--bg-2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:14px;font-family:var(--mono);
  font-size:13px;outline:none;resize:vertical}
.editor .bar{display:flex;justify-content:space-between;align-items:center;margin:8px 0}

/* graph */
#graph-svg{width:100%;height:100%;display:block}
.gnode{cursor:pointer}
.gnode text{font-size:11px;fill:var(--text);pointer-events:none}
.glink{stroke:var(--border);stroke-width:1.2}
.glink.sem{stroke:var(--accent);stroke-dasharray:4 3;opacity:.6}

/* settings */
.set-wrap{max-width:620px;margin:0 auto;padding:26px}
.set-row{display:flex;justify-content:space-between;align-items:center;
  padding:14px 0;border-bottom:1px solid var(--border-soft);gap:20px}
.set-row .lab{font-size:14px}
.set-row .desc{font-size:12px;color:var(--faint);margin-top:2px}
.set-row input[type=number],.set-row input[type=text]{background:var(--bg-2);
  border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 9px;width:120px}
h1.page{font-size:20px;margin:0 0 6px}

/* command palette */
#palette{position:fixed;inset:0;background:#0007;display:none;
  align-items:flex-start;justify-content:center;z-index:50;backdrop-filter:blur(2px)}
#palette.open{display:flex}
.pal-box{margin-top:12vh;width:560px;max-width:92vw;background:var(--bg-2);
  border:1px solid var(--border);border-radius:12px;overflow:hidden;
  box-shadow:0 20px 60px #0009}
.pal-box input{width:100%;border:0;background:transparent;color:var(--text);
  padding:15px 18px;font-size:15px;outline:none;border-bottom:1px solid var(--border)}
.pal-list{max-height:340px;overflow-y:auto;padding:6px}
.pal-item{padding:10px 13px;border-radius:7px;font-size:13.5px;display:flex;
  justify-content:space-between;gap:12px}
.pal-item.sel{background:var(--accent-soft)}
.pal-item .k{color:var(--faint);font-size:11px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--bg-3);border:1px solid var(--border);border-radius:8px;
  padding:10px 16px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app">
  <!-- ribbon -->
  <div id="ribbon">
    <div class="logo">⚡</div>
    <button class="rib active" data-view="chat" title="Chats (⌘1)">💬</button>
    <button class="rib" data-view="graph" title="Graph (⌘2)">🕸</button>
    <button class="rib" data-view="calendar" title="Calendar (⌘3)">📅</button>
    <button class="rib" data-view="tasks" title="Tasks (⌘4)">✅</button>
    <div class="spacer"></div>
    <button class="rib" id="btn-theme" title="Toggle theme">🌓</button>
    <button class="rib" data-view="settings" title="Settings">⚙️</button>
  </div>

  <!-- left explorer -->
  <div id="left">
    <div class="panel-head"><span id="left-title">Chats</span>
      <span class="acts">
        <button class="iconbtn" id="btn-new" title="New chat (⌘N)">＋</button>
        <button class="iconbtn" id="btn-collapse-left" title="Collapse">«</button>
      </span>
    </div>
    <div class="search"><input id="q" placeholder="Search…"/></div>
    <div id="list"></div>
  </div>

  <!-- main workspace -->
  <div id="main">
    <div id="tabbar">
      <div class="tab active" id="tab-label">💬 Chat</div>
      <div class="grow"></div>
      <span class="pill" id="ollama-pill">·</span>
      <button class="iconbtn" id="btn-palette" title="Command palette (⌘P)">⌘P</button>
      <button class="iconbtn" id="btn-collapse-right" title="Toggle right sidebar">▤</button>
    </div>
    <div id="view"></div>
  </div>

  <!-- right context sidebar -->
  <div id="right">
    <div class="rtabs">
      <div class="rtab active" data-rtab="sources">Sources</div>
      <div class="rtab" data-rtab="outline">Outline</div>
      <div class="rtab" data-rtab="info">Info</div>
    </div>
    <div class="rbody" id="rbody"></div>
  </div>
</div>

<!-- command palette -->
<div id="palette"><div class="pal-box">
  <input id="pal-input" placeholder="Type a command…"/>
  <div class="pal-list" id="pal-list"></div>
</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-input" multiple hidden/>

<script>
const $ = s=>document.querySelector(s);
const api = {
  async j(method,path,body){
    const opt={method,headers:{}};
    if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
    const r=await fetch('/api'+path,opt);
    if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail||r.statusText);
    return r.json();
  },
  get:p=>api.j('GET',p), post:(p,b)=>api.j('POST',p,b),
  put:(p,b)=>api.j('PUT',p,b), patch:(p,b)=>api.j('PATCH',p,b), del:p=>api.j('DELETE',p),
};
const S={view:'chat',chats:[],current:null,chat:null,settings:{},sending:false,
  pendingFiles:null,rtab:'sources',srcMode:'full',calMonth:new Date()};

function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||2200);}
async function warmUp(){
  toast('Warming up models… (first load can take ~30s)',60000);
  try{const r=await api.post('/warmup');toast('✅ Models warm: '+r.models.join(', '));}
  catch(e){toast('⚠️ '+e.message,4000);}
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---- tiny markdown (escape first, then a safe subset) ---- */
function md(src){
  let t=esc(src);
  t=t.replace(/```([\s\S]*?)```/g,(m,c)=>`<pre><code>${c.replace(/^\n/,'')}</code></pre>`);
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/\[\[([^\]]+)\]\]/g,'<span class="wl">$1</span>');
  t=t.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  t=t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>');
  t=t.replace(/^\s*[-*]\s+(.*)$/gm,'<li>$1</li>');
  t=t.replace(/(<li>[\s\S]*?<\/li>)/g,m=>'<ul>'+m+'</ul>');
  t=t.split(/\n{2,}/).map(b=>/^<(ul|pre|h\d)/.test(b.trim())?b:`<p>${b.replace(/\n/g,'<br>')}</p>`).join('');
  return t;
}

/* ================= view routing ================= */
const RIBBON_TITLE={chat:'Chats',graph:'Graph',calendar:'Calendar',tasks:'Tasks',settings:'Settings'};
const TAB_LABEL={chat:'💬 Chat',graph:'🕸 Graph',calendar:'📅 Calendar',tasks:'✅ Tasks',settings:'⚙️ Settings'};
function setView(v){
  S.view=v;
  document.querySelectorAll('.rib[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  $('#left-title').textContent=RIBBON_TITLE[v]||'';
  $('#tab-label').textContent=TAB_LABEL[v]||'';
  $('#app').classList.toggle('no-right', v!=='chat');
  if(v==='chat') renderChatList(); else $('#list').innerHTML=leftHintFor(v);
  ({chat:renderChat,graph:renderGraph,calendar:renderCalendar,tasks:renderTasks,settings:renderSettings}[v])();
}
function leftHintFor(v){
  const map={graph:'Every chat & source as a node. Click to open.',
    calendar:'Pick a day to open its daily note.',
    tasks:'All <code>- [ ]</code> items across the vault.',
    settings:'Models, retrieval, web lookup, theme.'};
  return `<div style="padding:14px;color:var(--faint);font-size:12.5px">${map[v]||''}</div>`;
}

/* ================= CHAT ================= */
async function loadChats(){const d=await api.get('/chats');S.chats=d.chats;S.current=S.current||d.current;}
function renderChatList(){
  const q=($('#q').value||'').toLowerCase();
  const rows=S.chats.filter(c=>!q||c.title.toLowerCase().includes(q));
  $('#list').innerHTML = rows.length?rows.map(c=>`
    <div class="item ${c.id===S.current?'active':''}" data-id="${c.id}">
      <div class="t">${esc(c.title)}</div>
      <div class="m"><span>${c.messages} msg</span>${c.doc?`<span>📎 ${esc(c.doc)}</span>`:''}</div>
    </div>`).join('') : `<div style="padding:14px;color:var(--faint)">No chats yet. Press ＋.</div>`;
  document.querySelectorAll('#list .item').forEach(el=>el.onclick=()=>openChat(el.dataset.id));
}
async function openChat(id){S.current=id;S.chat=await api.get('/chats/'+id);renderChatList();renderChat();renderRight();}
async function newChat(){const c=await api.post('/chats');await loadChats();openChat(c.id);}
function renderChat(){
  if(S.view!=='chat')return;
  const c=S.chat;
  const hist=(c&&c.history)||[];
  const body = hist.length? hist.map(m=>`
    <div class="msg ${m.role}">
      <div class="av">${m.role==='user'?'🧑':'⚡'}</div>
      <div class="bubble">${m.content==='__SPIN__'?'<span class="spin"></span>':md(m.content)}</div>
    </div>`).join('')
    : `<div class="empty">Ask anything — it runs locally.<br><span style="font-size:13px;color:var(--faint)">Attach a document to ask about it with page-cited sources.</span></div>`;
  $('#view').innerHTML=`
    <div class="chat-col">
    <div class="chat-scroll" id="chat-scroll">
    <div class="chat-wrap">
      ${c?`<div class="chat-title">${esc(c.title||'New chat')}</div>`:''}
      ${body}
    </div>
    </div>
    <div class="composer">
      <div class="box">
        <textarea id="composer" rows="1" placeholder="${c?'Message FreeLAB…':'Start a chat (＋) first'}" ${c?'':'disabled'}></textarea>
        <button class="send" id="send" ${c?'':'disabled'}>➤</button>
      </div>
      <div class="tools">
        <span class="attach-chip" id="chip"></span>
        <span class="toggle" id="attach"><span class="iconbtn" style="width:auto">📎 Attach</span></span>
        <label class="toggle"><input type="checkbox" id="web" ${S.settings.web?'checked':''}/> Web lookup</label>
      </div>
    </div>
    </div>`;
  const ta=$('#composer');
  if(ta){ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,180)+'px';};
    ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};ta.focus();}
  if($('#send'))$('#send').onclick=send;
  if($('#attach'))$('#attach').onclick=()=>$('#file-input').click();
  if($('#web'))$('#web').onchange=e=>{S.settings.web=e.target.checked;api.put('/settings',{web:e.target.checked});};
  const sc=$('#chat-scroll');if(sc)sc.scrollTop=sc.scrollHeight;
  updateChip();
}
function updateChip(){const chip=$('#chip');if(!chip)return;
  if(S.pendingFiles&&S.pendingFiles.length){chip.style.display='inline-flex';
    chip.innerHTML=`📎 ${S.pendingFiles.length} file(s) ready — send to ingest`;}
  else chip.style.display='none';}
async function send(){
  const ta=$('#composer');if(!ta||S.sending)return;
  const text=ta.value.trim();if(!text&&!S.pendingFiles)return;
  S.sending=true;$('#send').disabled=true;
  try{
    if(S.pendingFiles&&S.pendingFiles.length){
      const fd=new FormData();[...S.pendingFiles].forEach(f=>fd.append('files',f));
      toast('Ingesting & embedding…');
      const r=await fetch('/api/chats/'+S.current+'/ingest',{method:'POST',body:fd});
      if(!r.ok)throw new Error((await r.json()).detail||'ingest failed');
      const j=await r.json();toast(`Indexed ${j.doc} · ${j.pages}p · ${j.chunks} chunks`);
      S.pendingFiles=null;
      S.chat=await api.get('/chats/'+S.current);  // refresh has_pdf / pages
      await loadChats();renderChatList();
    }
    if(text){
      // optimistic
      S.chat.history.push({role:'user',content:text});
      S.chat.history.push({role:'assistant',content:'__SPIN__'});
      renderChat();ta&&(ta.value='');
      await streamAsk(text);
    } else {renderChat();}
  }catch(e){toast('⚠️ '+e.message);
    if(S.chat.history.length&&S.chat.history[S.chat.history.length-1].content==='__SPIN__')
      S.chat.history.splice(-2);renderChat();}
  finally{S.sending=false;if($('#send'))$('#send').disabled=false;}
}
$('#file-input').onchange=e=>{S.pendingFiles=e.target.files;updateChip();
  toast(`${e.target.files.length} file(s) attached — press send`);};

/* ---- live pipeline ticker (real stages streamed from the backend) ---- */
function bubbleEl(){const b=document.querySelectorAll('.msg.assistant .bubble');return b[b.length-1];}
function renderTicker(stages){
  return `<div class="ticker">${stages.map(s=>
    `<div class="tk ${s.done?'done':'cur'}">${s.done?'✓':'<span class="spin"></span>'} ${s.label}</div>`).join('')}</div>`;
}
function paintTicker(stages){const el=bubbleEl();if(el)el.innerHTML=renderTicker(stages);
  const sc=$('#chat-scroll');if(sc)sc.scrollTop=sc.scrollHeight;}
function handleStage(ev,stages){
  const n=ev.name,i=ev.info||{};
  const starts={retrieving:'🔎 Compressing context…',drafting:'✍️ Drafting (small model)…',
    judging:'⚖️ Judging the draft…',escalating:'⬆️ Escalating to the big model…',
    generating:'🧠 Generating…',searching:'🌐 Searching the web…'};
  if(starts[n]){stages.forEach(s=>s.done=true);stages.push({label:starts[n],done:false});paintTicker(stages);return;}
  if(n==='direct'){stages.forEach(s=>s.done=true);
    stages.push({label:`⚡ Short input (${i.tokens} tok) — answering directly with the big model`,done:false});
    paintTicker(stages);return;}
  const cur=stages[stages.length-1];
  if(n==='retrieved'&&cur)cur.label=`🔎 Kept ${i.kept} of ${i.total} chunks`;
  else if(n==='drafted'&&cur)cur.label='✍️ Draft ready';
  else if(n==='judged'&&cur)cur.label=`⚖️ Judge score ${i.score} (needs ≥${i.threshold})`;
  else if(n==='kept'){if(cur)cur.done=true;stages.push({label:'✅ Draft kept — cheap path',done:true});}
  else if(n==='escalated'&&cur)cur.label='🧠 Big model answered';
  paintTicker(stages);
}
async function streamAsk(text){
  const stages=[];stages.push({label:'🔎 Starting…',done:false});paintTicker(stages);
  try{
    const resp=await fetch('/api/chats/'+S.current+'/ask_stream',
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
    if(!resp.ok||!resp.body)throw new Error('stream failed ('+resp.status+')');
    const reader=resp.body.getReader(),dec=new TextDecoder();let buf='';
    while(true){
      const {value,done}=await reader.read();if(done)break;
      buf+=dec.decode(value,{stream:true});let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const line=buf.slice(0,idx).trim();buf=buf.slice(idx+2);
        if(!line.startsWith('data:'))continue;
        const ev=JSON.parse(line.slice(5).trim());
        if(ev.type==='stage')handleStage(ev,stages);
        else if(ev.type==='done'){
          S.chat.history[S.chat.history.length-1].content=ev.answer;
          S.chat.title=ev.title;S.chat.last_sources=ev.last_sources;
          renderChat();renderRight();await loadChats();renderChatList();
        } else if(ev.type==='error') throw new Error(ev.message);
      }
    }
  }catch(e){toast('⚠️ '+e.message,4000);
    if(S.chat.history.length&&S.chat.history[S.chat.history.length-1].content==='__SPIN__')
      S.chat.history.splice(-2);
    renderChat();}
}

/* ================= RIGHT SIDEBAR ================= */
function highlight(text,query){
  let t=esc(text);
  const terms=[...new Set((query||'').toLowerCase().match(/[a-z0-9']+/g)||[])].filter(w=>w.length>3);
  if(terms.length){const re=new RegExp('\\b('+terms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\b','gi');
    t=t.replace(re,'<b>$1</b>');}
  return t;
}
function renderRight(){
  const b=$('#rbody');const c=S.chat;
  if(S.rtab==='sources'){
    const src=(c&&c.last_sources)||[];
    const hasPdf=c&&c.has_pdf, pages=(c&&c.pages)||0, q=(c&&c.last_query)||'';
    const cited=new Set(src.map(s=>s.page).filter(Boolean));
    const toggle = hasPdf? `<div class="src-toggle">
      <button class="${S.srcMode!=='full'?'on':''}" data-m="cited">⭐ Cited</button>
      <button class="${S.srcMode==='full'?'on':''}" data-m="full">📄 Full document</button></div>` : '';
    let inner;
    if(hasPdf && S.srcMode==='full'){
      inner = Array.from({length:pages},(_,i)=>i+1).map(p=>`
        <div class="page-wrap ${cited.has(p)?'cited':''}">
          <div class="page-cap"><span>Page ${p}</span>${cited.has(p)?'<span class="cited">★ cited</span>':''}</div>
          <img class="page-img" loading="lazy" src="/api/chats/${c.id}/page/${p}"/>
        </div>`).join('');
    } else if(src.length){
      inner = src.map(s=>`
        <details class="src" ${s.page?'open':''}><summary>
          <span>Chunk ${s.chunk}${s.page?` · p.${s.page}`:''}</span>
          <span style="color:var(--faint)">${s.score!=null&&s.score.toFixed?s.score.toFixed(2):''}</span></summary>
          <div class="body">${s.url?`<a href="${esc(s.url)}" target="_blank">${esc(s.title||s.url)}</a><br>`:''}${highlight((s.text||'').slice(0,700),q)}</div>
          ${hasPdf&&s.page?`<img class="page-img" loading="lazy" src="/api/chats/${c.id}/page/${s.page}"/>`:''}
        </details>`).join('');
    } else {
      inner = `<div class="side-empty">Cited passages appear here after you ask about an attached document.</div>`;
    }
    b.innerHTML = toggle + inner;
    b.querySelectorAll('.src-toggle button').forEach(btn=>btn.onclick=()=>{S.srcMode=btn.dataset.m;renderRight();});
  } else if(S.rtab==='outline'){
    const heads=[];(c&&c.history||[]).forEach((m,i)=>{if(m.role==='user')heads.push(m.content.slice(0,48));});
    b.innerHTML = heads.length? heads.map(h=>`<div class="item"><div class="t">${esc(h)}</div></div>`).join('')
      : `<div class="side-empty">Your questions in this chat show up here.</div>`;
  } else {
    b.innerHTML = c? `<div style="font-size:13px;line-height:1.9">
      <div><b>Title</b><br>${esc(c.title||'')}</div><br>
      <div><b>Messages</b> ${(c.history||[]).length}</div>
      <div><b>Document</b> ${c.doc?esc(c.doc):'—'}</div>
      <div><b>ID</b> <code style="font-size:11px">${c.id}</code></div></div>`
      : `<div class="side-empty">Open a chat.</div>`;
  }
}
document.querySelectorAll('.rtab').forEach(t=>t.onclick=()=>{
  S.rtab=t.dataset.rtab;document.querySelectorAll('.rtab').forEach(x=>x.classList.toggle('active',x===t));renderRight();});

/* ================= TASKS ================= */
async function renderTasks(){
  const d=await api.get('/tasks');const today=d.today;
  const groups={Overdue:[],Today:[],Upcoming:[],'No date':[],Done:[]};
  d.tasks.forEach(t=>{
    if(t.done){groups.Done.push(t);return;}
    if(!t.due)groups['No date'].push(t);
    else if(t.due<today)groups.Overdue.push(t);
    else if(t.due===today)groups.Today.push(t);
    else groups.Upcoming.push(t);
  });
  const cls=t=>t.due?(t.due<today?'over':t.due===today?'today':''):'';
  const block=(name)=>groups[name].length?`<div class="task-grp"><h3>${name} · ${groups[name].length}</h3>${
    groups[name].map(t=>`<div class="task ${t.done?'done':''}">
      <input type="checkbox" disabled ${t.done?'checked':''}/>
      <div class="tx">${md(t.text.replace(/📅\s*\d{4}-\d{2}-\d{2}/,'').trim())}
        <div class="src-note">📄 ${esc(t.note)}:${t.line}</div></div>
      ${t.due?`<span class="due ${cls(t)}">📅 ${t.due}</span>`:''}
    </div>`).join('')}</div>`:'';
  $('#view').innerHTML=`<div class="tasks-wrap"><h1 class="page">Tasks</h1>
    <div style="color:var(--faint);font-size:12.5px;margin-bottom:6px">Parsed from every note in the vault (Obsidian Tasks syntax). Check-off editing arrives in the next pass.</div>
    ${['Overdue','Today','Upcoming','No date','Done'].map(block).join('')||'<div class="side-empty">No tasks found. Add <code>- [ ] something 📅 2026-08-01</code> to any note.</div>'}
  </div>`;
}

/* ================= CALENDAR ================= */
async function renderCalendar(){
  const d=S.calMonth;const y=d.getFullYear(),m=d.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();
  const today=new Date().toISOString().slice(0,10);
  const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells='';for(let i=0;i<first;i++)cells+='<div class="cal-day blank"></div>';
  for(let day=1;day<=days;day++){
    const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    cells+=`<div class="cal-day ${ds===today?'today':''}" data-date="${ds}">${day}</div>`;
  }
  $('#view').innerHTML=`<div class="cal-wrap">
    <div class="cal-head"><button class="iconbtn" id="cal-prev">‹</button>
      <h2>${d.toLocaleString('default',{month:'long'})} ${y}</h2>
      <button class="iconbtn" id="cal-next">›</button></div>
    <div class="cal-grid">${dow.map(x=>`<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
    <div id="daily"></div></div>`;
  $('#cal-prev').onclick=()=>{S.calMonth=new Date(y,m-1,1);renderCalendar();};
  $('#cal-next').onclick=()=>{S.calMonth=new Date(y,m+1,1);renderCalendar();};
  document.querySelectorAll('.cal-day[data-date]').forEach(el=>el.onclick=()=>openDaily(el.dataset.date));
}
async function openDaily(date){
  const d=await api.get('/daily/'+date);
  $('#daily').innerHTML=`<div class="editor">
    <div class="bar"><b>${date}</b><button class="iconbtn" id="daily-save" style="width:auto;padding:6px 12px;background:var(--accent-soft);color:var(--accent)">Save</button></div>
    <textarea id="daily-body" placeholder="# ${date}\n\n- [ ] a task 📅 ${date}\n">${esc(d.body||'')}</textarea></div>`;
  $('#daily-save').onclick=async()=>{await api.put('/daily/'+date,{body:$('#daily-body').value});toast('Saved '+date);};
  $('#daily-body').focus();
}

/* ================= GRAPH ================= */
async function renderGraph(){
  const d=await api.get('/graph');
  const W=$('#view').clientWidth||900,H=$('#view').clientHeight||600;
  const N=d.nodes.map(n=>({...n,x:W/2+(Math.random()-.5)*260,y:H/2+(Math.random()-.5)*260,vx:0,vy:0}));
  const idx={};N.forEach((n,i)=>idx[n.id]=i);
  const E=d.edges.filter(e=>idx[e.source]!=null&&idx[e.target]!=null);
  // simple force sim
  for(let it=0;it<220;it++){
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      let dx=N[i].x-N[j].x,dy=N[i].y-N[j].y,dist=Math.hypot(dx,dy)||1;
      let f=2600/(dist*dist);N[i].vx+=dx/dist*f;N[i].vy+=dy/dist*f;N[j].vx-=dx/dist*f;N[j].vy-=dy/dist*f;}
    E.forEach(e=>{const a=N[idx[e.source]],b=N[idx[e.target]];let dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy)||1;
      let f=(dist-90)*0.02*(e.kind==='semantic'?(e.weight||.6):1);
      a.vx+=dx/dist*f;a.vy+=dy/dist*f;b.vx-=dx/dist*f;b.vy-=dy/dist*f;});
    N.forEach(n=>{n.vx+=(W/2-n.x)*0.002;n.vy+=(H/2-n.y)*0.002;
      n.x+=n.vx*=.85;n.y+=n.vy*=.85;n.x=Math.max(30,Math.min(W-30,n.x));n.y=Math.max(30,Math.min(H-30,n.y));});
  }
  const line=e=>{const a=N[idx[e.source]],b=N[idx[e.target]];
    return `<line class="glink ${e.kind==='semantic'?'sem':''}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;};
  const node=n=>`<g class="gnode" data-id="${n.id}" data-type="${n.type}">
    <circle cx="${n.x}" cy="${n.y}" r="${n.type==='source'?9:7}"
      fill="${n.type==='source'?'#5aa0e0':'var(--accent)'}" stroke="var(--bg)" stroke-width="2"/>
    <text x="${n.x+11}" y="${n.y+4}">${esc((n.label||'').slice(0,26))}</text></g>`;
  $('#view').innerHTML = N.length? `<svg id="graph-svg" viewBox="0 0 ${W} ${H}">
    ${E.map(line).join('')}${N.map(node).join('')}</svg>`
    : `<div class="empty">No nodes yet — start a couple of chats and they'll appear here, clustered by topic.</div>`;
  document.querySelectorAll('.gnode').forEach(g=>g.onclick=()=>{
    const id=g.dataset.id;if(g.dataset.type==='chat'){setView('chat');openChat(id);}});
}

/* ================= SETTINGS ================= */

  const s=await api.get('/settings');S.settings=s;
  const row=(lab,desc,ctrl)=>`<div class="set-row"><div><div class="lab">${lab}</div><div class="desc">${desc}</div></div><div>${ctrl}</div></div>`;
  $('#view').innerHTML=`<div class="set-wrap"><h1 class="page">Settings</h1>
    ${row('Keep (chunks)','How many top chunks feed the drafter.',`<input type="number" id="s-keep" value="${s.keep}"/>`)}
    ${row('Judge threshold','Judge score ≥ this keeps the cheap draft.',`<input type="number" id="s-thr" value="${s.threshold}"/>`)}
    ${row('Cascade','Draft→judge→escalate. Off = big model always.',`<input type="checkbox" id="s-casc" ${s.use_cascade?'checked':''}/>`)}
    ${row('Direct-answer threshold','Below this many input tokens, skip the cascade and answer directly with the big model (fast path for short queries). 0 disables.',`<input type="number" id="s-direct" value="${s.direct_below}"/>`)}
    ${row('Web lookup','Opt-in DuckDuckGo grounding (otherwise fully offline).',`<input type="checkbox" id="s-web" ${s.web?'checked':''}/>`)}
    ${row('Drafter model','',`<input type="text" id="s-draft" value="${s.drafter}"/>`)}
    ${row('Verifier model','',`<input type="text" id="s-ver" value="${s.verifier}"/>`)}
    ${row('Embed model','',`<input type="text" id="s-emb" value="${s.embed_model}"/>`)}
    <div style="margin-top:18px;display:flex;gap:10px">
      <button class="iconbtn" id="s-save" style="width:auto;padding:9px 18px;background:var(--accent);color:#fff">Save</button>
      <button class="iconbtn" id="s-warm" style="width:auto;padding:9px 18px;background:var(--accent-soft);color:var(--accent)">🔥 Warm up models</button>
    </div>
  </div>`;
  $('#s-warm').onclick=warmUp;
  $('#s-save').onclick=async()=>{
    const body={keep:+$('#s-keep').value,threshold:+$('#s-thr').value,
      use_cascade:$('#s-casc').checked,web:$('#s-web').checked,
      direct_below:+$('#s-direct').value,
      drafter:$('#s-draft').value,verifier:$('#s-ver').value,embed_model:$('#s-emb').value};
    S.settings=await api.put('/settings',body);toast('Settings saved');};
}

/* ================= COMMAND PALETTE ================= */
const COMMANDS=[
  {name:'New chat',key:'⌘N',run:newChat},
  {name:'Go to Chats',key:'⌘1',run:()=>setView('chat')},
  {name:'Open Graph',key:'⌘2',run:()=>setView('graph')},
  {name:'Open Calendar',key:'⌘3',run:()=>setView('calendar')},
  {name:'Open Tasks',key:'⌘4',run:()=>setView('tasks')},
  {name:"Go to today's daily note",run:()=>{setView('calendar');setTimeout(()=>openDaily(new Date().toISOString().slice(0,10)),50);}},
  {name:'Warm up models',run:warmUp},
  {name:'Toggle web lookup',run:()=>{S.settings.web=!S.settings.web;api.put('/settings',{web:S.settings.web});toast('Web lookup '+(S.settings.web?'on':'off'));if(S.view==='chat')renderChat();}},
  {name:'Toggle theme',run:toggleTheme},
  {name:'Open Settings',run:()=>setView('settings')},
];
let palSel=0,palRows=COMMANDS;
function openPalette(){$('#palette').classList.add('open');$('#pal-input').value='';palFilter('');$('#pal-input').focus();}
function closePalette(){$('#palette').classList.remove('open');}
function palFilter(q){palRows=COMMANDS.filter(c=>c.name.toLowerCase().includes(q.toLowerCase()));palSel=0;
  $('#pal-list').innerHTML=palRows.map((c,i)=>`<div class="pal-item ${i===palSel?'sel':''}" data-i="${i}">
    <span>${c.name}</span><span class="k">${c.key||''}</span></div>`).join('');
  document.querySelectorAll('.pal-item').forEach(el=>el.onclick=()=>{palRows[+el.dataset.i].run();closePalette();});}
$('#pal-input').oninput=e=>palFilter(e.target.value);
$('#pal-input').onkeydown=e=>{
  if(e.key==='ArrowDown'){palSel=Math.min(palSel+1,palRows.length-1);palFilter($('#pal-input').value);}
  else if(e.key==='ArrowUp'){palSel=Math.max(palSel-1,0);palFilter($('#pal-input').value);}
  else if(e.key==='Enter'){palRows[palSel]&&palRows[palSel].run();closePalette();}
  else if(e.key==='Escape')closePalette();};

/* ================= theme + globals ================= */
function toggleTheme(){const l=document.documentElement.classList.toggle('light');
  try{localStorage.setItem('fltheme',l?'light':'dark');}catch(e){}}
(function initTheme(){try{if(localStorage.getItem('fltheme')==='light')document.documentElement.classList.add('light');}catch(e){}})();

$('#btn-theme').onclick=toggleTheme;
$('#btn-new').onclick=newChat;
$('#btn-palette').onclick=openPalette;
$('#btn-collapse-left').onclick=()=>$('#app').classList.toggle('no-left');
$('#btn-collapse-right').onclick=()=>$('#app').classList.toggle('no-right');
$('#q').oninput=()=>{if(S.view==='chat')renderChatList();};
document.querySelectorAll('.rib[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));

document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='p'){e.preventDefault();openPalette();}
  else if(mod&&e.key.toLowerCase()==='n'){e.preventDefault();newChat();}
  else if(mod&&'1234'.includes(e.key)){e.preventDefault();setView(['chat','graph','calendar','tasks'][+e.key-1]);}
  else if(e.key==='Escape')closePalette();
});

(async function boot(){
  try{const h=await api.get('/health');

    $('#ollama-pill').style.color=h.ollama?'#4caf50':'#e5534b';}catch(e){}
  try{S.settings=await api.get('/settings');}catch(e){}
  await loadChats();
  if(S.current)await openChat(S.current); else renderChatList();
  setView('chat');
})();
